name: Cloudflare Production Cutover

on:
  push:
    branches:
      - feat/cloudflare-production-cutover

permissions:
  contents: read

concurrency:
  group: cloudflare-growth-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    if: contains(github.event.head_commit.message, '[cutover]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://pkypexzpyfbikdnkrzvw.supabase.co
      CANDIDATE_URL: https://smartvisions-growth-os-release-candidate.hamedarezoo900.workers.dev
      PRODUCTION_URL: https://app.smartvisionsai.com
      LEGACY_VERCEL_URL: https://smartvisions.vercel.app

    steps:
      - name: Checkout exact cutover commit
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preflight credentials and Cloudflare permissions
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          require(){ if [ -z "${!1:-}" ]; then echo "::error::Missing GitHub Actions secret: $1"; missing=1; fi; }
          require CLOUDFLARE_API_TOKEN
          require CLOUDFLARE_ACCOUNT_ID
          require NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
          if [ -z "${SUPABASE_SECRET_KEY:-}" ] && [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Missing Growth Supabase server credential"
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

          node <<'NODE'
          const api='https://api.cloudflare.com/client/v4';
          const headers={Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`};
          async function cf(path){
            const r=await fetch(api+path,{headers});
            const j=await r.json().catch(()=>({}));
            if(!r.ok||j.success===false)throw new Error(`Cloudflare read failed: ${path}`);
            return j;
          }
          const zones=(await cf('/zones?name=smartvisionsai.com&status=active&per_page=50')).result||[];
          if(zones.length!==1)throw new Error('Cloudflare zone read unavailable');
          await cf(`/zones/${zones[0].id}/dns_records?name=app.smartvisionsai.com&per_page=100`);
          await cf(`/zones/${zones[0].id}/workers/routes`);
          console.log('Cloudflare DNS and Workers Route permissions validated.');
          NODE

      - name: Verify independent Vercel rollback
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$LEGACY_VERCEL_URL/login")"
          [ "$code" = "200" ] || { echo "::error::Legacy Vercel rollback /login returned HTTP $code"; exit 1; }
          echo "Legacy Vercel rollback is healthy."

      - name: Validate Growth Supabase read-only
        shell: bash
        run: |
          set -euo pipefail
          key="${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/" -H "apikey: $key" -H "Accept: application/json")"
          [ "$status" = "200" ] || { echo "::error::Growth Supabase validation failed with HTTP $status"; exit 1; }
          echo "Growth Supabase server credential validated read-only."

      - name: Install, compatibility check and build
        run: |
          npm ci --no-audit --no-fund
          npx vinext check
          npm run build:vinext

      - name: Verify provider secret bindings already exist
        shell: bash
        run: |
          set -euo pipefail
          for worker in smartvisions-growth-os-release-candidate smartvisions-growth-os-production; do
            npx wrangler secret list --name "$worker" --format json > ".$worker.secret-names.json"
            WORKER="$worker" FILE=".$worker.secret-names.json" node <<'NODE'
          const fs=require('node:fs');
          const worker=process.env.WORKER;
          const rows=JSON.parse(fs.readFileSync(process.env.FILE,'utf8'));
          const names=new Set((Array.isArray(rows)?rows:[]).map(x=>x.name));
          const required=[
            'OPENAI_API_KEY','GOOGLE_PLACES_API_KEY','INTERNAL_API_KEY','META_APP_SECRET','META_WEBHOOK_VERIFY_TOKEN',
            'EMAIL_PROVIDER_API_KEY','EMAIL_WEBHOOK_SECRET','TELEGRAM_BOT_TOKEN','TELEGRAM_WEBHOOK_SECRET',
            'TELEGRAM_OWNER_USER_ID','TELEGRAM_OWNER_CHAT_ID','TELEGRAM_ORGANIZATION_ID'
          ];
          const missing=required.filter(k=>!names.has(k));
          if(!['META_WHATSAPP_ACCESS_TOKEN','META_WHATSAPP_TOKEN','WHATSAPP_ACCESS_TOKEN'].some(k=>names.has(k)))missing.push('WhatsApp access token alias');
          if(!['META_WHATSAPP_PHONE_NUMBER_ID','WHATSAPP_PHONE_NUMBER_ID'].some(k=>names.has(k)))missing.push('WhatsApp phone-number ID alias');
          if(missing.length)throw new Error(`${worker} missing secret binding name(s): ${missing.join(', ')}`);
          console.log(`${worker}: required provider secret binding names are present.`);
          NODE
          done
          rm -f .*.secret-names.json

      - name: Prepare isolated production-shaped candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const f='dist/server/wrangler.json';
          const c=JSON.parse(fs.readFileSync(f,'utf8'));
          c.name='smartvisions-growth-os-release-candidate';
          c.workers_dev=true;
          c.vars={
            ...(c.vars||{}),
            DEPLOYMENT_ENV:'production',
            NEXT_PUBLIC_APP_NAME:'Smart Visions Growth OS',
            NEXT_PUBLIC_SUPABASE_URL:'https://pkypexzpyfbikdnkrzvw.supabase.co',
            APP_BASE_URL:'https://app.smartvisionsai.com',
            EMAIL_PROVIDER:'RESEND',
            GLOBAL_KILL_SWITCH:'false',
            SHADOW_MODE:'true'
          };
          c.limits={...(c.limits||{}),cpu_ms:100};
          delete c.routes;
          delete c.route;
          fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n');
          if(c.name!=='smartvisions-growth-os-release-candidate'||c.limits?.cpu_ms!==100||c.routes||c.route)throw new Error('Candidate config validation failed');
          NODE

      - name: Deploy and smoke isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config dist/server/wrangler.json
          printf '%s' "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" | npx wrangler secret put NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY --config dist/server/wrangler.json >/dev/null
          if [ -n "${SUPABASE_SECRET_KEY:-}" ]; then
            printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SECRET_KEY --config dist/server/wrangler.json >/dev/null
          else
            printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config dist/server/wrangler.json >/dev/null
          fi
          node scripts/cloudflare-safe-smoke.mjs

      - name: Promote exact validated bundle to unrouted production Worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const f='dist/server/wrangler.json';
          const c=JSON.parse(fs.readFileSync(f,'utf8'));
          c.name='smartvisions-growth-os-production';
          c.workers_dev=false;
          if(c.limits?.cpu_ms!==100)throw new Error('CPU guard drifted');
          if(c.routes||c.route)throw new Error('Production bundle must not carry routes');
          if(c.workers_dev!==false)throw new Error('Production workers.dev must be disabled');
          fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n');
          NODE
          npx wrangler deploy --config dist/server/wrangler.json
          printf '%s' "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" | npx wrangler secret put NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY --config dist/server/wrangler.json >/dev/null
          if [ -n "${SUPABASE_SECRET_KEY:-}" ]; then
            printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SECRET_KEY --config dist/server/wrangler.json >/dev/null
          else
            printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config dist/server/wrangler.json >/dev/null
          fi

      - name: Snapshot exact app DNS and Worker Route state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const api='https://api.cloudflare.com/client/v4';
          const headers={Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`};
          async function cf(path){
            const r=await fetch(api+path,{headers});
            const j=await r.json();
            if(!r.ok||j.success===false)throw new Error(`Cloudflare read failed: ${path}`);
            return j;
          }
          const zones=(await cf('/zones?name=smartvisionsai.com&status=active&per_page=50')).result||[];
          if(zones.length!==1)throw new Error('Zone lookup mismatch');
          const zone=zones[0];
          const dns=(await cf(`/zones/${zone.id}/dns_records?name=app.smartvisionsai.com&per_page=100`)).result||[];
          const routes=(await cf(`/zones/${zone.id}/workers/routes`)).result||[];
          const exactRoutes=routes.filter(r=>r.pattern==='app.smartvisionsai.com/*');
          if(dns.length>1||exactRoutes.length>1)throw new Error(`Ambiguous app state: DNS=${dns.length}, exact routes=${exactRoutes.length}`);
          const snapshot={
            zoneId:zone.id,
            dns:dns.map(r=>({type:r.type,name:r.name,content:r.content,proxied:r.proxied,ttl:r.ttl})),
            routes:exactRoutes.map(r=>({pattern:r.pattern,script:r.script||null}))
          };
          fs.writeFileSync('cutover-snapshot.json',JSON.stringify(snapshot,null,2));
          console.log(`Snapshot captured: DNS=${snapshot.dns.length}, routes=${snapshot.routes.length}.`);
          NODE

      - name: Create proxied app DNS bridge
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('cutover-snapshot.json','utf8'));
          const api='https://api.cloudflare.com/client/v4';
          const headers={Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'};
          async function call(method,path,body){
            const r=await fetch(api+path,{method,headers,body:body?JSON.stringify(body):undefined});
            const j=await r.json();
            if(!r.ok||j.success===false)throw new Error(`Cloudflare write failed: ${method} ${path}`);
            return j;
          }
          const current=(await call('GET',`/zones/${s.zoneId}/dns_records?name=app.smartvisionsai.com&per_page=100`)).result||[];
          if(current.length>1)throw new Error('Multiple app DNS records appeared');
          const desired={type:'CNAME',name:'app',content:'smartvisions.vercel.app',ttl:1,proxied:true};
          if(!current.length){
            await call('POST',`/zones/${s.zoneId}/dns_records`,desired);
          } else {
            if(current[0].type!=='CNAME')throw new Error(`Existing app DNS type is ${current[0].type}; refusing overwrite`);
            await call('PUT',`/zones/${s.zoneId}/dns_records/${current[0].id}`,desired);
          }
          console.log('Proxied app DNS bridge ready.');
          NODE

      - name: Attach Growth production Worker Route
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('cutover-snapshot.json','utf8'));
          const api='https://api.cloudflare.com/client/v4';
          const headers={Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'};
          async function call(method,path,body){
            const r=await fetch(api+path,{method,headers,body:body?JSON.stringify(body):undefined});
            const j=await r.json();
            if(!r.ok||j.success===false)throw new Error(`Cloudflare route write failed: ${method} ${path}`);
            return j;
          }
          const exact=((await call('GET',`/zones/${s.zoneId}/workers/routes`)).result||[]).filter(r=>r.pattern==='app.smartvisionsai.com/*');
          if(exact.length>1)throw new Error('Multiple exact app Worker Routes exist');
          if(exact.length===1&&exact[0].script!=='smartvisions-growth-os-production')throw new Error(`Existing app route points to ${exact[0].script||'no script'}`);
          if(!exact.length)await call('POST',`/zones/${s.zoneId}/workers/routes`,{pattern:'app.smartvisionsai.com/*',script:'smartvisions-growth-os-production'});
          console.log('Growth production Worker Route attached.');
          NODE

      - name: Routed production smoke
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          check(){
            path="$1"; expected="$2"; name="$(printf '%s' "$path"|tr '/?' '__')"
            code="$(curl --silent --show-error --noproxy '*' --doh-url https://cloudflare-dns.com/dns-query --max-time 30 \
              --dump-header "$tmp/$name.h" --output "$tmp/$name.b" --write-out '%{http_code}' "$PRODUCTION_URL$path" || printf '000')"
            ray="$(grep -i '^cf-ray:' "$tmp/$name.h" || true)"
            echo "$path -> HTTP $code cf-ray=$([ -n "$ray" ] && echo yes || echo no)"
            [[ "$code" =~ ^($expected)$ ]] && [ -n "$ray" ]
          }
          for attempt in $(seq 1 20); do
            if check "/login" "200"; then ready=1; break; fi
            sleep 3
          done
          [ "${ready:-0}" = "1" ] || { echo "::error::Production route did not become healthy"; exit 1; }
          check "/" "301|302|303|307|308"
          check "/p/cloudflare-cutover-missing-$GITHUB_RUN_ID" "404"
          CANDIDATE_URL="$PRODUCTION_URL" node scripts/cloudflare-safe-smoke.mjs

      - name: Roll back app DNS and route on failed cutover
        if: failure() && hashFiles('cutover-snapshot.json') != ''
        shell: bash
        run: |
          set +e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('cutover-snapshot.json','utf8'));
          const api='https://api.cloudflare.com/client/v4';
          const headers={Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'};
          async function call(method,path,body){
            const r=await fetch(api+path,{method,headers,body:body?JSON.stringify(body):undefined});
            const j=await r.json().catch(()=>({}));
            return {ok:r.ok&&j.success!==false,j};
          }
          const routes=await call('GET',`/zones/${s.zoneId}/workers/routes`);
          for(const r of (routes.j.result||[]).filter(x=>x.pattern==='app.smartvisionsai.com/*'))await call('DELETE',`/zones/${s.zoneId}/workers/routes/${r.id}`);
          for(const r of s.routes)await call('POST',`/zones/${s.zoneId}/workers/routes`,{pattern:r.pattern,script:r.script});
          const dns=await call('GET',`/zones/${s.zoneId}/dns_records?name=app.smartvisionsai.com&per_page=100`);
          for(const r of (dns.j.result||[]))await call('DELETE',`/zones/${s.zoneId}/dns_records/${r.id}`);
          for(const r of s.dns)await call('POST',`/zones/${s.zoneId}/dns_records`,{type:r.type,name:r.name,content:r.content,proxied:r.proxied,ttl:r.ttl});
          console.log('Rollback attempt completed.');
          NODE
          curl --silent --show-error --max-time 30 --output /dev/null --write-out 'legacy-vercel-login HTTP %{http_code}\n' "$LEGACY_VERCEL_URL/login" || true

      - name: Cutover summary
        if: always()
        shell: bash
        run: |
          rm -f .*.secret-names.json cutover-snapshot.json
          echo "Production Worker: smartvisions-growth-os-production"
          echo "Production URL: https://app.smartvisionsai.com"
          echo "Production workers.dev exposure: disabled"
          echo "Legacy rollback URL retained: https://smartvisions.vercel.app"
          echo "No Vercel secret transfer performed in this run"
          echo "CPU guard: 100ms"
          echo "Website apex/www routes: not modified"
          echo "Real outreach/provider sends: none"
