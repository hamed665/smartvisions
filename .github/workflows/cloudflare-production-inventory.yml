# Migration-only read-only inventory. Remove before PR B merges.
name: Cloudflare Production Inventory

on:
  push:
    branches:
      - feat/cloudflare-production-cutover
    paths:
      - .github/workflows/cloudflare-production-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret presence preflight
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "Cloudflare credentials are present. Values were not printed."

      - name: Inventory application runtime environment names
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const names=new Set();
          const extensions=new Set(['.ts','.tsx','.js','.jsx','.mjs','.cjs']);
          function scan(file){
            const text=fs.readFileSync(file,'utf8');
            for(const m of text.matchAll(/process\.env(?:\.([A-Z][A-Z0-9_]*)|\[['"]([A-Z][A-Z0-9_]*)['"]\])/g)) names.add(m[1]||m[2]);
          }
          function walk(target){
            if(!fs.existsSync(target)) return;
            const stat=fs.statSync(target);
            if(stat.isFile()){ if(extensions.has(path.extname(target))) scan(target); return; }
            for(const entry of fs.readdirSync(target)){
              if(['node_modules','.next','dist','.git'].includes(entry)) continue;
              walk(path.join(target,entry));
            }
          }
          ['app','components','lib','proxy.ts','vite.config.ts'].forEach(walk);
          console.log('APPLICATION_RUNTIME_ENV_NAMES');
          [...names].sort().forEach(name=>console.log(name));
          NODE

      - name: Inventory callback and Vercel-origin references
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const hits=[];
          const extensions=new Set(['.ts','.tsx','.js','.jsx','.mjs','.cjs','.md','.json']);
          const patterns=[/vercel\.app/i,/webhook/i,/callback/i,/redirect/i];
          function walk(target){
            if(!fs.existsSync(target)) return;
            const stat=fs.statSync(target);
            if(stat.isFile()){
              if(!extensions.has(path.extname(target))) return;
              const text=fs.readFileSync(target,'utf8');
              if(patterns.some(re=>re.test(text))) hits.push(target);
              return;
            }
            for(const entry of fs.readdirSync(target)){
              if(['node_modules','.next','dist','.git'].includes(entry)) continue;
              walk(path.join(target,entry));
            }
          }
          ['app','lib','docs','.env.example','vercel.json'].forEach(walk);
          console.log('CALLBACK_OR_ORIGIN_REFERENCE_FILES');
          hits.sort().forEach(file=>console.log(file));
          NODE

      - name: Read-only Cloudflare account, zones, routes and DNS shape
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          async function cf(path){
            const r=await fetch(`https://api.cloudflare.com/client/v4${path}`,{headers});
            const body=await r.json().catch(()=>({}));
            return {status:r.status,body};
          }
          function errors(result){
            return (result?.body?.errors||[]).map(e=>`${e.code??'unknown'}:${String(e.message||'error').slice(0,160)}`).join(' | ');
          }
          const scripts=await cf(`/accounts/${account}/workers/scripts`);
          if(scripts.body?.success){
            const ids=(scripts.body.result||[]).map(x=>x.id).filter(Boolean).sort();
            console.log('WORKER_SCRIPTS');
            ids.forEach(id=>console.log(id));
          }else console.log(`WORKER_SCRIPTS_UNAVAILABLE HTTP=${scripts.status} ${errors(scripts)}`);

          const domains=await cf(`/accounts/${account}/workers/domains`);
          if(domains.body?.success){
            console.log('WORKER_CUSTOM_DOMAINS');
            for(const d of domains.body.result||[]){
              console.log(JSON.stringify({hostname:d.hostname||d.name||null,service:d.service||null,environment:d.environment||null}));
            }
          }else console.log(`WORKER_CUSTOM_DOMAINS_UNAVAILABLE HTTP=${domains.status} ${errors(domains)}`);

          const zones=await cf('/zones?per_page=50');
          if(!zones.body?.success){
            console.log(`ZONES_UNAVAILABLE HTTP=${zones.status} ${errors(zones)}`);
            process.exit(0);
          }
          console.log('ZONES');
          for(const zone of zones.body.result||[]){
            console.log(JSON.stringify({name:zone.name,status:zone.status}));
            const routes=await cf(`/zones/${zone.id}/workers/routes`);
            if(routes.body?.success){
              for(const route of routes.body.result||[]){
                console.log(`ROUTE ${zone.name} ${JSON.stringify({pattern:route.pattern,script:route.script||null})}`);
              }
            }else console.log(`ROUTES_UNAVAILABLE ${zone.name} HTTP=${routes.status} ${errors(routes)}`);

            const dns=await cf(`/zones/${zone.id}/dns_records?per_page=100`);
            if(dns.body?.success){
              for(const rec of dns.body.result||[]){
                if(rec.proxied || /smartvisions|growth|app|os/i.test(rec.name||'')){
                  console.log(`DNS ${zone.name} ${JSON.stringify({name:rec.name,type:rec.type,proxied:Boolean(rec.proxied)})}`);
                }
              }
            }else console.log(`DNS_UNAVAILABLE ${zone.name} HTTP=${dns.status} ${errors(dns)}`);
          }
          NODE

      - name: Safety summary
        run: |
          echo "Read-only inventory complete."
          echo "No secret values were printed."
          echo "No Worker, route, custom domain or DNS mutation was performed."
