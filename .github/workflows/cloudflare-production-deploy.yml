name: Cloudflare Production Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cloudflare-growth-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_NAME: Smart Visions Growth OS
      NEXT_PUBLIC_SUPABASE_URL: https://pkypexzpyfbikdnkrzvw.supabase.co
      CANDIDATE_URL: https://smartvisions-growth-os-release-candidate.hamedarezoo900.workers.dev
      PRODUCTION_URL: https://app.smartvisionsai.com
      EMAIL_PROVIDER: RESEND
      GLOBAL_KILL_SWITCH: false
      SHADOW_MODE: true

    steps:
      - name: Checkout exact green main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Production credential preflight
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          require(){ if [ -z "${!1:-}" ]; then echo "::error::Missing GitHub Actions secret: $1"; missing=1; fi; }
          require CLOUDFLARE_API_TOKEN
          require CLOUDFLARE_ACCOUNT_ID
          require NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
          if [ -z "${SUPABASE_SECRET_KEY:-}" ] && [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Missing Growth Supabase server credential"
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          echo "Permanent deploy credentials are present. Values were not printed."

      - name: Validate Growth Supabase credential read-only
        shell: bash
        run: |
          set -euo pipefail
          key="${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/" \
            -H "apikey: $key" \
            -H "Accept: application/json")"
          [ "$status" = "200" ] || { echo "::error::Growth Supabase validation failed with HTTP $status"; exit 1; }
          echo "Growth Supabase server credential validated read-only against pkypexzpyfbikdnkrzvw."

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Vinext compatibility gate
        run: npx vinext check

      - name: Build exact Cloudflare Workers bundle
        run: npm run build:vinext

      - name: Verify provider secret bindings already exist on both Workers
        shell: bash
        run: |
          set -euo pipefail
          for worker in smartvisions-growth-os-release-candidate smartvisions-growth-os-production; do
            npx wrangler secret list --name "$worker" --format json > ".$worker.secret-names.json"
            WORKER="$worker" FILE=".$worker.secret-names.json" node <<'NODE'
          const fs=require('node:fs');
          const worker=process.env.WORKER;
          const rows=JSON.parse(fs.readFileSync(process.env.FILE,'utf8'));
          const names=new Set((Array.isArray(rows)?rows:[]).map(x=>x.name));
          const required=[
            'OPENAI_API_KEY','GOOGLE_PLACES_API_KEY','INTERNAL_API_KEY','META_APP_SECRET','META_WEBHOOK_VERIFY_TOKEN',
            'EMAIL_PROVIDER_API_KEY','EMAIL_WEBHOOK_SECRET','TELEGRAM_BOT_TOKEN','TELEGRAM_WEBHOOK_SECRET',
            'TELEGRAM_OWNER_USER_ID','TELEGRAM_OWNER_CHAT_ID','TELEGRAM_ORGANIZATION_ID'
          ];
          const missing=required.filter(k=>!names.has(k));
          if(!['META_WHATSAPP_ACCESS_TOKEN','META_WHATSAPP_TOKEN','WHATSAPP_ACCESS_TOKEN'].some(k=>names.has(k)))missing.push('WhatsApp access token alias');
          if(!['META_WHATSAPP_PHONE_NUMBER_ID','WHATSAPP_PHONE_NUMBER_ID'].some(k=>names.has(k)))missing.push('WhatsApp phone-number ID alias');
          if(missing.length)throw new Error(`${worker} is missing required secret binding name(s): ${missing.join(', ')}`);
          console.log(`${worker}: required provider secret binding names are present; values were not read.`);
          NODE
          done
          rm -f .*.secret-names.json

      - name: Prepare isolated production-shaped release candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='dist/server/wrangler.json';
          const c=JSON.parse(fs.readFileSync(file,'utf8'));
          c.name='smartvisions-growth-os-release-candidate';
          c.workers_dev=true;
          c.vars={
            ...(c.vars||{}),
            DEPLOYMENT_ENV:'production',
            NEXT_PUBLIC_APP_NAME:'Smart Visions Growth OS',
            NEXT_PUBLIC_SUPABASE_URL:'https://pkypexzpyfbikdnkrzvw.supabase.co',
            APP_BASE_URL:'https://app.smartvisionsai.com',
            EMAIL_PROVIDER:'RESEND',
            GLOBAL_KILL_SWITCH:'false',
            SHADOW_MODE:'true'
          };
          c.limits={...(c.limits||{}),cpu_ms:100};
          delete c.routes;
          delete c.route;
          fs.writeFileSync(file,JSON.stringify(c,null,2)+'\n');
          if(c.name!=='smartvisions-growth-os-release-candidate'||c.limits?.cpu_ms!==100||c.routes||c.route)throw new Error('Release candidate config validation failed');
          console.log('Release candidate config validated: no production route, CPU guard=100ms.');
          NODE

      - name: Deploy exact release candidate while preserving provider secrets
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Re-assert Growth Supabase bindings on release candidate
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" | npx wrangler secret put NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY --config dist/server/wrangler.json >/dev/null
          if [ -n "${SUPABASE_SECRET_KEY:-}" ]; then
            printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SECRET_KEY --config dist/server/wrangler.json >/dev/null
          else
            printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config dist/server/wrangler.json >/dev/null
          fi
          echo "Candidate Supabase bindings re-asserted without printing values."

      - name: Safe release-candidate smoke
        run: node scripts/cloudflare-safe-smoke.mjs

      - name: Controlled SSR load
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base=process.env.CANDIDATE_URL;
          const paths=Array.from({length:40},(_,i)=>i%4===0?'/':'/login');
          let failed=0;
          for(let i=0;i<paths.length;i+=5){
            const results=await Promise.all(paths.slice(i,i+5).map(async path=>{try{return (await fetch(base+path,{redirect:'manual'})).status}catch{return 0}}));
            for(const status of results)if(![200,301,302,303,307,308].includes(status))failed++;
          }
          console.log(`Controlled load requests=${paths.length} unexpected=${failed}`);
          if(failed)process.exit(1);
          NODE

      - name: Promote exact validated bundle to production Worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const file='dist/server/wrangler.json';
          const c=JSON.parse(fs.readFileSync(file,'utf8'));
          c.name='smartvisions-growth-os-production';
          if(c.limits?.cpu_ms!==100)throw new Error('CPU guard drifted before promotion');
          if(c.routes||c.route)throw new Error('Production deploy must not mutate Worker Routes');
          fs.writeFileSync(file,JSON.stringify(c,null,2)+'\n');
          NODE
          npx wrangler deploy --config dist/server/wrangler.json

      - name: Re-assert Growth Supabase bindings on production Worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" | npx wrangler secret put NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY --config dist/server/wrangler.json >/dev/null
          if [ -n "${SUPABASE_SECRET_KEY:-}" ]; then
            printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SECRET_KEY --config dist/server/wrangler.json >/dev/null
          else
            printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config dist/server/wrangler.json >/dev/null
          fi
          echo "Production Supabase bindings re-asserted without printing values."

      - name: Verify production Growth Worker Route remains attached
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const api='https://api.cloudflare.com/client/v4';
          const headers={Authorization:`Bearer ${token}`};
          async function cf(path){const r=await fetch(api+path,{headers});const j=await r.json();if(!r.ok||j.success===false)throw new Error(`Cloudflare read failed: ${path}`);return j;}
          const zones=(await cf('/zones?name=smartvisionsai.com&status=active&per_page=50')).result||[];
          if(zones.length!==1)throw new Error('smartvisionsai.com zone lookup mismatch');
          const routes=(await cf(`/zones/${zones[0].id}/workers/routes`)).result||[];
          const pattern='app.smartvisionsai.com/*';
          if(!routes.some(r=>r.pattern===pattern&&r.script==='smartvisions-growth-os-production'))throw new Error(`Production Worker Route missing: ${pattern}`);
          console.log('Production Growth Worker Route remains attached.');
          NODE

      - name: Immediate routed production smoke
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          check(){
            path="$1"; expected="$2"; name="$(printf '%s' "$path"|tr '/?' '__')"
            code="$(curl --silent --show-error --noproxy '*' --doh-url https://cloudflare-dns.com/dns-query --max-time 30 --dump-header "$tmp/$name.h" --output "$tmp/$name.b" --write-out '%{http_code}' "$PRODUCTION_URL$path" || printf '000')"
            ray="$(grep -i '^cf-ray:' "$tmp/$name.h" || true)"
            echo "$path -> HTTP $code cf-ray=$([ -n "$ray" ] && echo yes || echo no)"
            [[ "$code" =~ ^($expected)$ ]] && [ -n "$ray" ]
          }
          check "/login" "200"
          check "/" "301|302|303|307|308"
          check "/p/cloudflare-production-missing-$GITHUB_RUN_ID" "404"

      - name: Safe production API and webhook rejection smoke
        env:
          CANDIDATE_URL: https://app.smartvisionsai.com
        run: node scripts/cloudflare-safe-smoke.mjs

      - name: Deployment summary
        if: always()
        run: |
          rm -f .*.secret-names.json
          echo "Source gate: successful push-based CI on main"
          echo "Candidate Worker: smartvisions-growth-os-release-candidate"
          echo "Production Worker: smartvisions-growth-os-production"
          echo "Production hostname: app.smartvisionsai.com"
          echo "CPU guard: 100ms"
          echo "Provider secret values read by permanent deploy: none"
          echo "DNS/Worker Route mutation by normal deploy: none"
          echo "Vercel dependency after cutover: none"
          echo "Outbound provider sends invoked by smoke: none"
