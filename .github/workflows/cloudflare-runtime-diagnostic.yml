# Migration-only workflow. Explicit source-config Node/env diagnostic. Delete before merging PR A.
name: Cloudflare Runtime Diagnostic

on:
  push:
    branches:
      - feat/cloudflare-runtime-readiness
    paths:
      - .github/workflows/cloudflare-runtime-diagnostic.yml
      - wrangler.jsonc
      - 'app/p/**/page.tsx'
      - 'app/api/telegram/webhook/route.ts'
      - 'lib/preview/public-persistence.ts'
      - 'tests/public-preview-persistence.test.ts'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: https://pkypexzpyfbikdnkrzvw.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CANDIDATE_URL: https://smartvisions-growth-os-release-candidate.hamedarezoo900.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact candidate
        run: |
          npm ci --no-audit --no-fund
          npm test -- --run tests/public-preview-persistence.test.ts
          npm run build:vinext
          node <<'NODE'
          const fs=require('node:fs');
          const file='dist/server/wrangler.json';
          const config=JSON.parse(fs.readFileSync(file,'utf8'));
          config.name='smartvisions-growth-os-release-candidate';
          config.workers_dev=true;
          config.vars={...(config.vars||{}),DEPLOYMENT_ENV:'candidate',NEXT_PUBLIC_SUPABASE_URL:'https://pkypexzpyfbikdnkrzvw.supabase.co',GLOBAL_KILL_SWITCH:'false',SHADOW_MODE:'true'};
          config.limits={...(config.limits||{}),cpu_ms:100};
          delete config.routes; delete config.route;
          console.log(JSON.stringify({compatibility_date:config.compatibility_date,compatibility_flags:config.compatibility_flags||[],var_keys:Object.keys(config.vars||{}).sort()}));
          fs.writeFileSync(file,JSON.stringify(config,null,2)+'\n');
          NODE
      - name: Deploy and reassert minimal secrets
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config dist/server/wrangler.json
          printf '%s' "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" | npx wrangler secret put NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY --config dist/server/wrangler.json >/dev/null
          printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SECRET_KEY --config dist/server/wrangler.json >/dev/null
      - name: Stream foreground Tail during diagnostic requests
        shell: bash
        run: |
          set -euo pipefail
          (
            sleep 8
            node -e 'const base=process.env.CANDIDATE_URL; const paths=["/login","/","/api/telegram/webhook","/p/__migration-ok","/p/__migration-not-found"]; for (const path of paths) { try { const r=await fetch(base+path,{redirect:"manual"}); const body=(path.includes("telegram/webhook")||path.includes("__migration-ok")) ? await r.text() : ""; console.error(`[probe] ${path} -> ${r.status}${body ? ` ${body.slice(0,240)}` : ""}`); } catch (error) { console.error(`[probe] ${path} -> request-error`, error); } }'
          ) &
          traffic_pid=$!
          set +e
          timeout 25s npx wrangler tail smartvisions-growth-os-release-candidate --format pretty
          tail_code=$?
          set -e
          wait "$traffic_pid"
          echo "tail_exit=$tail_code"
          [ "$tail_code" -eq 124 ] || [ "$tail_code" -eq 0 ]
